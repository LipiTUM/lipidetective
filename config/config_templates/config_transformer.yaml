---
model: 'transformer'
cuda:
  gpu_nr: [1]

# File paths can be:
# - Relative: resolved from project directories (data/, models/, experiments/)
# - Absolute: used as-is
# Override base directories with environment variables:
#   LIPIDETECTIVE_DATA_DIR, LIPIDETECTIVE_MODELS_DIR, LIPIDETECTIVE_OUTPUT_DIR
files:
   # Relative to data/ or $LIPIDETECTIVE_DATA_DIR
   train_input: 'processed/train_dataset.hdf5'
   val_input: 'processed/val_dataset.hdf5'
   test_input: 'processed/test_dataset.hdf5'
   predict_input: 'raw/sample.mzML'
   # Relative to models/ or $LIPIDETECTIVE_MODELS_DIR
   saved_model: 'lipidetective_model.pth'
   model_config: null  # Optional: explicit path to model_config.yaml sidecar (auto-detected next to saved_model by default)
   # Relative to experiments/ or $LIPIDETECTIVE_OUTPUT_DIR
   output: 'output'
   # Relative to config/
   splitting_instructions: 'validation_splits/train_val_split.yaml'
   precomputed: False  # Set to True to use pre-computed Parquet features instead of raw HDF5.
                       # Parquet files must be generated with precompute_dataset.py first.
workflow:
  train: False
  validate: False
  test: False
  tune: False
  predict: True
  save_model: False
  load_model: True
  log_every_n_steps: 10
training:
  k: 6
  learning_rate: 0.004
  lr_step: 2
  epochs: 15
  batch: 512
  nr_workers: 0
test:
  batch: 512
  confidence_score: True
tune:
   nr_trials: 1
   grace_period: 2
   resources_per_trial: null # CPUs and GPUs according to availability
predict:
  output: "best_prediction" # to return the top three predictions set this to "top3"
  batch: 512
  save_spectrum: False
  confidence_threshold: 0.98
  keep_empty: False
  keep_wrong_polarity_preds: False
input_embedding:
  n_peaks: 30
  max_mz: 1600
  decimal_accuracy: 1
transformer:
  d_model: 32 # embedding dimension d_model must be divisible by num_heads
  num_heads: 4
  dropout: 0.1
  ffn_hidden: 256
  num_layers: 2
  output_seq_length: 11
  decode_strategy: 'beam'  # 'beam' or 'greedy'. Can be overridden per predict() call.
# wandb: # Uncomment if you want to use wandb
#  group: 'Debugging'
# logging:
#   level: INFO     # DEBUG | INFO | WARNING | ERROR | CRITICAL
#   file: null      # Optional: path to log file
comment: 'Info on the purpose of the current run'
...