[tool.poetry]
name = "lipidetective"
version = "0.1.0"
description = "A deep learning framework for the identification of molecular lipid species from tandem mass spectra."
authors = ["Vivian Wuerf", "Nikolai Koehler", "Florian Molnar", "Lisa Hahnefeld", "Robert Gurke", "Michael Witting", "Josch K. Pauling"]
license = "BSD 3-Clause License"
readme = "README.md"
packages = [{ include = "lipidetective", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.3.0"
pytorch-lightning = "^2.1.2"
ray = {version = "2.6.3", extras = ["tune"]}
numpy = "^1.26.3"
matplotlib = "^3.8.0"
h5py = "^3.9.0"
pandas = "^2.1.4"
seaborn = "^0.13.2"
sphinx = "^7.2.6"
sphinx-togglebutton = "^0.3.2"
sphinx_rtd_theme = "^2.0.0"
torchmetrics = "^1.2.1"
umap-learn = "^0.5.5"
pyyaml = "^6.0.1"
scikit-learn = "^1.3.1"
wandb = "^0.18"
pyteomics = "4.6.3"
lxml = "5.1.0"
holoviews = "^1.18.1"

[tool.poetry.group.dev.dependencies]
poetry-core = "^1.9.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
types-PyYAML = "^6.0.0"

pandas-stubs = "^2.3.3.260113"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
lipidetective = "lipidetective.lipidetective:main"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["import-untyped"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src/lipidetective",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
]
