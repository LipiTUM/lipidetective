[project]
name = "lipidetective"
version = "0.2.0"
description = "A deep learning framework for the identification of molecular lipid species from tandem mass spectra."
authors = [
    {name = "Vivian Wuerf"},
    {name = "Nikolai Koehler"},
    {name = "Florian Molnar"},
    {name = "Lisa Hahnefeld"},
    {name = "Robert Gurke"},
    {name = "Michael Witting"},
    {name = "Josch K. Pauling"},
]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["lipidomics", "mass-spectrometry", "deep-learning", "transformer", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3.0",
    "pytorch-lightning>=2.1.2",
    "ray[tune]>=2.7.0",
    "numpy>=1.26.3",
    "matplotlib>=3.8.0",
    "h5py>=3.9.0",
    "pandas>=2.1.4",
    "seaborn>=0.13.2",
    "torchmetrics>=1.6.0",
    "umap-learn>=0.5.7",
    "numba>=0.58.0",  # Ensure Python 3.11+ compatible version
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.1",
    "wandb>=0.18",
    "pyteomics==4.6.3",
    "lxml==5.1.0",
    "holoviews>=1.18.1",
    "panel>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.0",
    "pandas-stubs>=2.3.3.260113",
    "types-seaborn>=0.13.2.20251221",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-togglebutton>=0.3.2",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
lipidetective = "lipidetective.lipidetective:main"

[project.urls]
Homepage = "https://github.com/LipiTUM/lipidetective"
Documentation = "https://lipitum.github.io/lipidetective/"
Repository = "https://github.com/LipiTUM/lipidetective"
"Bug Tracker" = "https://github.com/LipiTUM/lipidetective/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lipidetective"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["lipidetective"]
known-third-party = ["wandb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src/lipidetective",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: end-to-end workflow tests using real data",
]
